version: "3.8"
services:

  # Applications
  config-service:
    build: ../../config-service
    container_name: "config-service"
    ports:
      - 8888:8888
    environment:
      - BPL_JVM_THREAD_COUNT=50

  userprofile-service:
    build: ../../userprofile-service
    depends_on:
      - config-service
      - blog-postgres
    container_name: "userprofile-service"
    ports:
      - 9010:9010
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://blog-postgres:5432/blogdb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_CLOUD_CONFIG_URI=http://config-service:8888

  post-service:
    build: ../../post-service
    depends_on:
      - config-service
      - blog-postgres
    container_name: "post-service"
    ports:
      - 9020:9020
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://blog-postgres:5432/blogdb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_CLOUD_CONFIG_URI=http://config-service:8888

  edge-service:
    build: ../../edge-service
    depends_on:
      - config-service
      - blog-postgres
      - userprofile-service
      - post-service
    container_name: "edge-service"
    ports:
      - 9000:9000
    environment:
      - USERPROFILE_SERVICE_URL=http://userprofile-service:9010
      - POST_SERVICE_URL=http://post-service:9020
      - SPRING_CLOUD_CONFIG_URI=http://config-service:8888

  # Backing Services
  blog-redis:
    image: "redis:7.0"
    container_name: "blog-redis"
    ports:
      - 6379:6379

  blog-rabbitmq:
    image: rabbitmq:3.10-management
    container_name: blog-rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf

  blog-postgres:
    image: "postgres:latest"
    container_name: "blog-postgres"
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=blogdb
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
    driver: local
